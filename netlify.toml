# The Next.js app lives in ./site, not at the repo root.
[build]
  base = "site"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9+; pin a current LTS so Netlify doesn't pick an older default.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify detects Next.js automatically and installs its runtime plugin
# (@netlify/plugin-nextjs), so no [[plugins]] block is needed.
